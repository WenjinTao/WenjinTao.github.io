<style>
  :root { --bg: #c9cccf; --fg: #1d2126; --dim: #555d66; --panel: rgba(240,242,244,.86); --line: #aab1b8; --acc: #1f5fbf; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1a1d21; --fg: #dfe3e8; --dim: #97a0aa; --panel: rgba(24,27,31,.86); --line: #3a4048; --acc: #6ea2ff; } }
  :root[data-theme="dark"] { --bg: #1a1d21; --fg: #dfe3e8; --dim: #97a0aa; --panel: rgba(24,27,31,.86); --line: #3a4048; --acc: #6ea2ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  .panel { position: fixed; background: var(--panel); border-radius: 6px; backdrop-filter: blur(6px); }
  #hud { left: 12px; top: 12px; padding: 10px 12px; max-width: min(430px, calc(100vw - 48px)); }
  #hud b { font-weight: 600; } .d { color: var(--dim); }
  #hud table { border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
  #hud td { padding: 1px 10px 1px 0; vertical-align: top; } #hud td:first-child { color: var(--dim); }
  #sw { display: flex; gap: 3px; margin-top: 6px; flex-wrap: wrap; }
  #sw span { width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--line); }
  #bar { left: 12px; right: 12px; bottom: 12px; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #bar button { background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 9px; font: inherit; cursor: pointer; }
  #bar button:hover { border-color: var(--dim); } #bar button.on { border-color: var(--acc); color: var(--acc); }
  .sep { width: 1px; align-self: stretch; background: var(--line); }
  @media (max-width: 640px) { #hud { font-size: 12px; } #hud table { display: none; } }
</style>

  slRo = mix(0.0, 0.05 * (1.0 - tow) + (over > 0.5 ? -0.03 : 0.04), f);

  { float n = slN(p * 0.012) * 0.6 + slN(p * 0.05 + 2.0) * 0.4;

function slSurface(mat, kind, grime) {

  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vObj; varying vec3 vObjN;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvObj = position; vObjN = normal;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\n' + SL_PARS)
      .replace('#include <map_fragment>', '#include <map_fragment>\n' + SL_MAIN + '\ndiffuseColor.rgb *= slCol;')
      .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\nroughnessFactor = clamp(roughnessFactor + slRo, 0.04, 1.0);')
      .replace('#include <normal_fragment_maps>', '#include <normal_fragment_maps>\nnormal = slBump(-vViewPosition, normal, slHt * 0.001, faceDirection);');   // mm -> m

// ---- decode: base64 -> deflate-raw -> varint streams (delta-coded 0.05 mm grid, high-water-mark indices) ----
const b2u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function inflate(u8) {

}
function varints(buf, at, n) {                       // n unsigned LEB128 values starting at byte 'at'

}
const unzz = v => (v % 2 ? -(v + 1) / 2 : v / 2);
function decodeGroup(buf, g, meta) {          // meta: that asset's bake.json (grid step, uv scale)

  for (let a = 0; a < 3; a++) { let acc = 0; for (let i = 0; i < nv; i++) { acc += unzz(d[a * nv + i]); pos[3 * i + a] = acc * q; } }

// creased normals straight from the shared-vertex index (three's toCreasedNormals hashes positions: seconds here)

  }

// ---- materials: palette entry -> standard material + one procedural surface kind (+ floor grime) ----
function kindOf(p) {
  if (p.cls === 'rubber') return 'rubber';
  if (p.cls === 'leather' || p.cls === 'fabric') return 'suede';
  if (p.cls === 'carbon') return 'carbon';
  if (p.metal > 0.6) return p.rough < 0.25 ? 'polished' : 'brushed';
  return 'paint';
}
const allMats = [];
function makeMat(p, i, tex, grime = true) {                 // tex: { decal, atlas } textures; grime: dirt near the floor (vehicle-scale assets)
  if (p.cls === 'glass')   // standard (not physical) transparent: a far smaller program, same look at 6 % opacity
    return new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.04, metalness: 0, transparent: true, opacity: 0.06,
      depthWrite: false, side: THREE.DoubleSide, envMapIntensity: 1.4 });
  const carbon = kindOf(p) === 'carbon' && p.cls !== 'decal' && p.cls !== 'atlas';
  // carbon parts are lacquered: the weave sits under a glossy clear coat whose normal stays smooth (no weave bump)
  const m = carbon
    ? new THREE.MeshPhysicalMaterial({ roughness: Math.max(p.rough, 0.18), metalness: p.metal, clearcoat: 1, clearcoatRoughness: 0.02,

  m.color.setRGB(p.rgb[0], p.rgb[1], p.rgb[2], THREE.SRGBColorSpace);

  if (p.tex === 'atlas') m.map = tex.atlas;                    // small parts that keep a crop of their texture (icons)
  slSurface(m, p.cls === 'decal' || p.cls === 'atlas' ? 'paint' : kindOf(p), grime);

}

async function jpgTex(b64) {                                    // embedded jpg -> sRGB texture (no URL: works on file:// and under strict CSP)
  if (!b64) return null;
  const bmp = await createImageBitmap(new Blob([b2u(b64)], { type: 'image/jpeg' }), { imageOrientation: 'flipY' });

// ---- scene ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false; renderer.shadowMap.needsUpdate = true;   // static scene: shadow map drawn once
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
scene.background = new THREE.Color(dark ? 0x1a1d21 : 0xc9cccf);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.6;

const t0 = performance.now();
const buf = await inflate(b2u(BIN));
const tex = { decal: await jpgTex(DECAL), atlas: await jpgTex(ATLAS) };
const mats = META.palette.map((p, i) => makeMat(p, i, tex));
const byPal = new Map();
for (const g of META.groups) {
  let geo = decodeGroup(buf, g, META);
  geo = g.uv !== undefined ? (geo.computeVertexNormals(), geo.toNonIndexed()) : creased(geo, THREE.MathUtils.degToRad(35));
  if (!geo.attributes.uv) geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count * 2), 2));

}
const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; root.scale.setScalar(0.001); scene.add(root);   // Z-up mm -> Y-up m
const meshes = [];
let tris = 0;
for (const [pi, list] of byPal) {
  const geo = mergeGeometries(list); tris += geo.attributes.position.count / 3;
  const mesh = new THREE.Mesh(geo, mats[pi]); mesh.castShadow = META.palette[pi].cls !== 'glass'; mesh.receiveShadow = true;
  mesh.renderOrder = META.palette[pi].cls === 'glass' ? 1 : 0; root.add(mesh); meshes.push(mesh);
}
const buildMs = performance.now() - t0;
root.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(root), ctr = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());

const floorMat = new THREE.MeshStandardMaterial({ color: 0x7b8087, roughness: 0.55 });
slSurface(floorMat, 'floor', false);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(12000, 12000), floorMat);
floor.scale.setScalar(0.001); floor.rotation.x = -Math.PI / 2; floor.position.set(ctr.x, box.min.y - 0.0005, ctr.z); floor.receiveShadow = true;
scene.add(floor);
scene.add(new THREE.HemisphereLight(0xe8eef5, 0x4a4640, 0.45));
const sun = new THREE.DirectionalLight(0xfff4e6, 2.2);
sun.position.set(ctr.x + 2.5, box.max.y + 3, ctr.z + 3); sun.target.position.copy(ctr);
Object.assign(sun.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5, near: 0.5, far: 15 });
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.01; sun.shadow.radius = 3; sun.castShadow = true;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.6); fill.position.set(ctr.x - 3, box.max.y + 2, ctr.z - 3); scene.add(fill);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.02, 100);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.dampingFactor = 0.12;
controls.target.copy(ctr); controls.minDistance = 0.4; controls.maxDistance = 12; controls.maxPolarAngle = Math.PI * 0.495;
const R = Math.max(size.x, size.y, size.z) * 2.1;
const VIEWS = { '34': [0.75, 0.42, 0.9], side: [1, 0.25, 0.02], back: [-0.25, 0.35, -1], top: [0.02, 1, 0.05] };
function view(k) { const v = new THREE.Vector3(...VIEWS[k]).normalize().multiplyScalar(R); camera.position.copy(ctr).add(v); controls.update(); }
view('34');
// the asset's front (forks) points along -Y in USD = +Z in three after the root rotation; the views above look at it

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.updateGtaoMaterial({ radius: 0.25, distanceExponent: 1.5, thickness: 1.0, scale: 1.0, samples: 16 });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
gtao.blendIntensity = 0.9;
composer.addPass(gtao); composer.addPass(new OutputPass());

// ---- HUD ----
const $ = id => document.getElementById(id);
const S = META.stats, kb = (document.documentElement.outerHTML.length / 1024).toFixed(0);
const ncol = META.palette.filter(p => !['glass', 'decal', 'atlas'].includes(p.cls)).length;
$('stats').innerHTML = `<table>
<tr><td>source</td><td>NVIDIA SimReady vehicle_forklift_orange_a01: 25 MB to render (19 MB geometry + 6.3 MB textures)</td></tr>
<tr><td>this page</td><td>${kb} kB, one file</td></tr>
<tr><td>triangles</td><td>${S.src_tris.toLocaleString()} → ${tris.toLocaleString()}</td></tr>
<tr><td>textures</td><td>10 × 1024² PNG → ${ncol}-colour palette + shader; decal kept as ${(S.decal_bytes / 1024).toFixed(0)} kB jpg</td></tr>
<tr><td>shape error</td><td>median ${S.deviation_mm.orig_to_new_50} mm · p95 ${S.deviation_mm.orig_to_new_95} mm · p99 ${S.deviation_mm.orig_to_new_99} mm</td></tr>
<tr><td>built</td><td>${buildMs.toFixed(0)} ms in the browser</td></tr></table>`;
for (const p of META.palette) { if (p.cls === 'glass') continue; const s = document.createElement('span'); s.style.background = `rgb(${p.rgb.map(v => Math.round(v * 255))})`; s.title = `${p.cls} · rough ${p.rough} · metal ${p.metal}`; $('sw').appendChild(s); }

let spin = true;

controls.addEventListener('start', () => { spin = false; $('spin').classList.remove('on'); });
let aoWanted = true, shown = '';

$('ao').onclick = () => { aoWanted = !aoWanted; $('ao').classList.toggle('on', aoWanted); refresh(); };
$('det').onclick = () => {
  const on = !$('det').classList.contains('on'); $('det').classList.toggle('on', on);
  for (const m of [...allMats, floorMat]) { m.userData.surf.uDetail.value = on ? 1 : 0; m.userData.surf.uGrime.value = on ? 1 : 0; }
  refresh();
};
const flat = META.palette.map((p, i) => new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL((i * 0.618) % 1, 0.65, 0.55), transparent: p.cls === 'glass', opacity: p.cls === 'glass' ? 0.2 : 1 }));

  meshes.forEach(m => { m.userData.mat ??= m.material; m.material = on ? flat[mats.indexOf(m.userData.mat)] : m.userData.mat; });

$('wire').onclick = () => {

document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => view(b.dataset.v));

// compile every program in parallel (KHR_parallel_shader_compile) without blocking the page, then draw
{ // compile for the composer's offscreen target (linear, no tone mapping), or the first frame compiles everything again
  const t = performance.now(); renderer.setRenderTarget(composer.readBuffer); await renderer.compileAsync(scene, camera); renderer.setRenderTarget(null);
  window.__compileMs = performance.now() - t; }
{ // benchmark: first frame (texture upload + shadow/AO programs + shadow map), independent of rAF

}
// Interaction quality. AO costs ~50 ms/frame on an integrated GPU at 2.5k px, which made orbiting feel laggy (14 fps).
// While the camera moves (drag, inertia, turntable): no AO, and drop to 1x pixels if frames still run long.
// When it has rested 200 ms: one frame at full pixel ratio with AO, then no rendering until something changes.
const FULL_DPR = Math.min(devicePixelRatio, 1.5);
let fastDpr = FULL_DPR, mode = 'full', lastMove = 0, moveFrames = 0, ema = 16;
let last = performance.now(), W = innerWidth, H = innerHeight;
controls.addEventListener('change', () => { lastMove = performance.now(); });
function setMode(m) {

renderer.setAnimationLoop(() => {
