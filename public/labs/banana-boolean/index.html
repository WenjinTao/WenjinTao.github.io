<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banana Boolean</title>
<meta name="description" content="Slice a banana with a real Boolean kernel: our own C++ compiled to WebAssembly, running in your browser, with physics.">
<!-- link previews (LinkedIn, X, Slack): og:image must be an absolute URL once deployed; set OG_BASE in deploy -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://taowenjin.com/labs/banana-boolean/">
<meta property="og:title" content="Banana Boolean">
<meta property="og:description" content="Swipe to slice. Every cut is a real Boolean, computed in your browser by our own geometry kernel.">
<meta property="og:image" content="https://taowenjin.com/labs/banana-boolean/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">

<meta name="twitter:image" content="https://taowenjin.com/labs/banana-boolean/og-image.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #08090c; --fg: #eef0f4; --dim: #8a94a6; --cyan: #78e1ff; --amber: #ffaf46; --red: #ff6058;
          --glass: rgba(8, 10, 14, 0.72); --line: rgba(255, 255, 255, 0.14);
          --ink: #1d2747; --cream: #fdf4de; --yel: #ffc21a; --yel2: #ffd24d; --score: #c26f00;
          --round: "Fredoka", "Baloo 2", "Segoe UI Rounded", "Segoe UI", system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
               font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  [hidden] { display: none !important; }
  .ink { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 15px;
             background: var(--bg); z-index: 10; letter-spacing: 0.04em; }

  /* logo: a sticker drawn as SVG text - cream outer ring, thick navy outline, cream letters, a yellow swoosh and
     three sparks (stacked copies of the same text, so the outline reads on the dark scene) */
  .logo { position: fixed; left: 14px; top: 30px; width: 270px; height: auto; transform: rotate(-6deg);
          transform-origin: left top; pointer-events: none; user-select: none; overflow: visible;
          filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.5)); }

  /* toolbar: a cream pill with a navy outline, bold rounded labels, line icons */
  button { background: transparent; color: var(--fg); border: 1px solid transparent; border-radius: 999px;
           padding: 8px 14px; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
           white-space: nowrap; }
  button:disabled { opacity: 0.35; cursor: default; }
  .ic { width: 19px; height: 19px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4;
        stroke-linecap: round; stroke-linejoin: round; }
  .bar { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); display: flex; align-items: center; gap: 0;
         padding: 5px 6px; border-radius: 999px; background: var(--cream); border: 2.5px solid var(--ink);
         box-shadow: 0 4px 0 var(--ink), 0 12px 28px rgba(0, 0, 0, 0.4); }
  .bar button { color: var(--ink); font: 600 17px/1 var(--round); padding: 9px 15px; }
  .bar button:hover { background: rgba(29, 39, 71, 0.08); }
  .bar button.on { background: var(--ink); color: var(--cream); }
  .bar .sep { width: 1.5px; height: 24px; background: rgba(29, 39, 71, 0.22); margin: 0 3px; flex: none; }
  #sound .off, #music .off { display: none; } #sound.muted .on, #music.muted .on { display: none; }
  #sound.muted .off, #music.muted .off { display: inline; }
  .bar #challenge { background: var(--yel); color: var(--ink); font-weight: 700; padding: 9px 24px; margin: 0 2px;
                    border: 2px solid var(--ink); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12); }
  .bar #challenge:hover { background: var(--yel2); }
  .bar #challenge .ic { fill: currentColor; stroke: none; }

  .hint { position: fixed; left: 50%; bottom: 98px; transform: translateX(-50%); color: #c9cfdb; font-size: 13px;
          white-space: nowrap; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8); transition: opacity 1s; pointer-events: none; }
  .hint.gone { opacity: 0; }
  #guide { z-index: 3; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5)); }
  #gcap { position: fixed; left: 50%; bottom: 102px; transform: translateX(-50%); z-index: 3; pointer-events: none;
          background: var(--cream); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 18px;
          box-shadow: 0 4px 0 var(--ink), 0 10px 24px rgba(0, 0, 0, 0.4); padding: 10px 20px 11px; text-align: center;
          font: 500 18px/1.25 var(--round); white-space: nowrap; transition: opacity 0.6s; }
  #gcap b { font-weight: 700; } #gcap.tip b { color: var(--score); }
  #gcap small { display: block; margin-top: 3px; font-size: 13px; opacity: 0.7; }
  #gcap.gone { opacity: 0; }
  /* the kernel's numbers (with the mesh): stays technical */
  #stats { position: fixed; left: 18px; top: 178px; font: 12px/1.6 Consolas, ui-monospace, monospace; color: var(--dim);
           background: var(--glass); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  #stats b { color: var(--cyan); font-weight: 400; } #stats b.busy { color: var(--amber); } #stats .bad b { color: var(--red); }
  .credit { position: fixed; right: 12px; bottom: 6px; color: #5d6676; font-size: 10px; }
  .credit a { color: #7a8494; }
  /* round timer, fly-view tag, score panel: same cream + navy */
  #timer { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); font: 600 32px/1 var(--round); color: var(--ink);
           background: var(--cream); padding: 8px 20px; border-radius: 999px; border: 2.5px solid var(--ink);
           box-shadow: 0 4px 0 var(--ink); font-variant-numeric: tabular-nums; }
  #timer b { color: var(--score); font-weight: 700; }
  #timer.low { color: #d23a2f; }
  /* score card, top right: same sticker style as the toolbar */
  #scorecard { position: fixed; right: 22px; top: 20px; min-width: 190px; padding: 12px 24px 14px; text-align: right;
               background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 22px;
               box-shadow: 0 5px 0 var(--ink), 0 12px 26px rgba(0, 0, 0, 0.4); font-family: var(--round);
               pointer-events: none; transform-origin: 80% 30%; }
  #scorecard .lab { font: 700 17px/1 var(--round); letter-spacing: 0.14em; opacity: 0.7; }
  #pts { font: 700 64px/1.02 var(--round); font-variant-numeric: tabular-nums; }
  #scorecard .sub { font: 500 17px/1.25 var(--round); opacity: 0.85; } #scorecard .sub b { color: var(--score); font-weight: 700; }
  #scorecard.bump { animation: sc-bump 0.28s ease-out; }
  #scorecard.combo-bump { animation: sc-combo 0.55s ease-out; }
  @keyframes sc-bump { 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @keyframes sc-combo { 25% { transform: scale(1.18) rotate(-3deg); background: var(--yel); } 100% { transform: scale(1); } }
  #povtag { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); font: 600 14px/1 var(--round); color: var(--ink);
            background: var(--cream); padding: 8px 16px; border-radius: 999px; border: 2px solid var(--ink); }
  #panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(360px, 88vw); z-index: 5;
           background: var(--cream); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 18px; padding: 18px 20px;
           box-shadow: 0 5px 0 var(--ink), 0 18px 40px rgba(0, 0, 0, 0.45); font-family: var(--round); }
  #panel button { color: var(--ink); border: 2px solid var(--ink); padding: 6px 16px; font: 600 15px/1.2 var(--round); }
  #panel button:hover { background: rgba(29, 39, 71, 0.08); }
  #panel button.on { background: var(--ink); color: var(--cream); }
  #panel #again, #submit button { background: var(--yel); }
  #result { font-size: 16px; font-weight: 500; margin-bottom: 12px; } #result b { color: var(--score); font-size: 32px; font-weight: 700; }
  #submit { display: flex; gap: 8px; margin-bottom: 14px; }
  #name { flex: 1; min-width: 0; background: #fff; color: var(--ink); border: 2px solid var(--ink);
          border-radius: 999px; padding: 7px 14px; font: 500 15px/1.2 var(--round); }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; } #panel .tabs button { padding: 3px 12px; font-size: 13px; }
  #board { margin: 0; padding-left: 28px; font: 500 15px/1.5 var(--round); min-height: 40px; }
  #board li { padding: 1px 0; } #board li span { float: right; font-weight: 700; }
  #board li.me { background: var(--yel2); border-radius: 6px; margin-left: -6px; padding-left: 6px; }
  #board .empty { list-style: none; margin-left: -28px; color: #7a7f8f; }
  .prow { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  /* combo pop-up at the cut: cream letters with a navy outline, yellow for multi-slice combos */
  .combo { position: fixed; z-index: 4; pointer-events: none; transform: translate(-50%, -50%); white-space: nowrap;
           font: 700 var(--sz, 26px)/1 var(--round); color: var(--cream); -webkit-text-stroke: 6px var(--ink);
           paint-order: stroke fill; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.45));
           animation: combo-pop 1.25s cubic-bezier(.2, .8, .3, 1) forwards; }
  .combo.big { color: var(--yel); }
  @keyframes combo-pop {
    0% { transform: translate(-50%, -30%) scale(.4); opacity: 0; }
    14% { transform: translate(-50%, -60%) scale(1.18); opacity: 1; }
    26% { transform: translate(-50%, -70%) scale(1); }
    75% { opacity: 1; }
    100% { transform: translate(-50%, -160%) scale(.96); opacity: 0; } }
  @media (max-width: 600px) {
    .logo { width: 170px; left: 8px; top: 22px; }
    .bar { bottom: 26px; } .bar .lbl { display: none; } .bar button { padding: 9px 11px; }
    .bar #challenge { padding: 9px 16px; } #challenge .lbl { display: inline; }
    .hint { bottom: 90px; font-size: 12px; }
    #gcap { bottom: 88px; font-size: 15px; padding: 8px 14px 9px; white-space: normal; width: max-content; max-width: 88vw; }
    #stats { left: 12px; top: 112px; font-size: 11px; }
    .credit { left: 12px; text-align: center; font-size: 9px; }
    #timer { font-size: 26px; top: 52px; }
    #scorecard { right: 10px; top: 10px; min-width: 108px; padding: 8px 14px 9px; border-radius: 16px; }
    #pts { font-size: 38px; } #scorecard .lab, #scorecard .sub { font-size: 12px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<svg class="logo" viewBox="0 0 270 150" role="img" aria-label="Banana Boolean">
  <defs><g id="lg-t" font-family="Fredoka, &quot;Baloo 2&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="52" font-weight="700"><text x="16" y="62">Banana</text><text x="44" y="116">Boolean</text></g>
    <path id="lg-s" d="M40 136 C 100 142, 180 134, 244 112" fill="none" stroke-linecap="round"/></defs>
  <use href="#lg-s" stroke="#fdf4de" stroke-width="18"/><use href="#lg-s" stroke="#1d2747" stroke-width="13"/>
  <use href="#lg-s" stroke="#ffc21a" stroke-width="7"/>
  <use href="#lg-t" fill="#fdf4de" stroke="#fdf4de" stroke-width="22" stroke-linejoin="round"/>
  <use href="#lg-t" fill="#1d2747" stroke="#1d2747" stroke-width="14" stroke-linejoin="round"/>
  <use href="#lg-t" fill="#fdf4de"/>
  <g stroke="#ffc21a" stroke-width="5" stroke-linecap="round"><path d="M226 30 L219 38"/><path d="M238 20 L240 6"/><path d="M248 32 L260 26"/></g>
</svg>
<!-- the kernel's numbers: shown with the mesh (Mesh / M) -->
<div id="stats" hidden>
  <div>pieces <b id="pieces">1</b> · triangles <b id="tris">–</b></div>
  <div>kernel <b id="ms">–</b></div>
  <div id="openrow">open edges <b id="open">0</b></div>
  <div>volume check <b id="vol">–</b></div>
</div>
<div class="bar">
  <button id="reset" title="a fresh banana"><svg class="ic" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3.5v5h-5"/></svg><span class="lbl">Reset</span></button>
  <span class="sep"></span>
  <button id="toss" title="throw the pieces"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20V5"/><path d="M6 11l6-6 6 6"/></svg><span class="lbl">Toss</span></button>
  <span class="sep"></span>
  <button id="mesh" title="show the kernel's triangles (M)"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M7.5 12h9M12 4l-4.5 8M12 4l4.5 8M7.5 12L12 20l4.5-8"/></svg><span class="lbl">Mesh</span></button>
  <span class="sep"></span>
  <button id="sound" title="sound on / off"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path class="on" d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/><path class="off" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg></button>
  <button id="music" title="music on / off"><svg class="ic" viewBox="0 0 24 24"><path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/><path class="off" d="M3 3l18 18"/></svg></button>
  <span class="sep lb" hidden></span>
  <button id="challenge" class="lb" hidden title="cut as many pieces as you can in 10 s"><svg class="ic" viewBox="0 0 24 24"><path d="M7 4.5l13 7.5-13 7.5z"/></svg><span class="lbl">10 s</span></button>
  <span class="sep lb" hidden></span>
  <button id="scores" class="lb" hidden title="leaderboard"><svg class="ic" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4.5a3.5 3.5 0 0 0 4 4M16 6h3.5a3.5 3.5 0 0 1-4 4M12 13v4M8 20h8M9.5 17h5"/></svg></button>
</div>
<div class="hint gone" id="hint"></div>
<!-- first-visit guide (app.js: guide) -->
<svg id="guide" class="ink" aria-hidden="true">
  <line id="gline" stroke="#fdf4de" stroke-width="4" stroke-dasharray="2 11" stroke-linecap="round"/>
  <g id="gmouse" style="display:none"><path d="M0 0 L0 22 L6 16.5 L10.5 26 L14.5 24.2 L10 14.8 L17.5 14.8 Z" fill="#fdf4de" stroke="#1d2747" stroke-width="2.2" stroke-linejoin="round"/></g>
  <g id="gtouch" style="display:none"><circle r="17" fill="rgba(253,244,222,0.25)" stroke="#fdf4de" stroke-width="2.5"/><circle r="8" fill="#fdf4de" stroke="#1d2747" stroke-width="2"/></g>
</svg>
<div id="gcap"></div>
<div id="timer" hidden></div>
<div id="scorecard" aria-live="polite"><div class="lab">SCORE</div><div id="pts">0</div><div class="sub">best combo <b id="bestc">–</b></div></div>
<div id="povtag" hidden>fly view · V to go back</div>
<div id="panel" hidden>
  <div id="result"></div>
  <form id="submit" hidden>
    <input id="name" maxlength="16" placeholder="your name" autocomplete="nickname">
    <button type="submit">Submit</button>
  </form>
  <div class="tabs"><button id="tday" class="on">Today</button><button id="tall">All time</button></div>
  <ol id="board"></ol>
  <div class="prow"><button id="again">Play again</button><button id="close">Close</button></div>
</div>
<div id="loading">loading the kernel and the banana…</div>
<div class="credit">
  Boolean kernel: our own C++, in WebAssembly · models: NVIDIA SimReady,
  <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>
</div>
<script type="module" src="app.js?v=b291ec8e57"></script>
</body>
</html>
